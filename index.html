<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic</title>
    
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    
    <div id="leftToolbar">
        <div>
            <p><b>Sources</b></p>
            <div class="gate-selector" id="source">
                <a><img src="static/images/gates/source.svg" alt="Source" width="50" height="50">
                    <p>Source</p>
                </a>
            </div>

            <div class="gate-selector" id="clock">
                <a><img src="static/images/gates/clock.svg" alt="Clock" width="50" height="50">
                    <p>Clock</p>
                </a>
            </div>

            <p><b>Basic gates</b></p>
            <div class="gate-selector" id="not">
                <a><img src="static/images/gates/not.svg" alt="NOT gate" width="50" height="50">
                    <p>Not</p>
                </a>
            </div>

            <div class="gate-selector" id="and">
                <a><img src="static/images/gates/and.svg" alt="AND gate" width="50" height="50">
                    <p>AND</p>
                </a>
            </div>

            <div class="gate-selector" id="or">
                <a><img src="static/images/gates/or.svg" alt="OR gate" width="50" height="50">
                    <p>OR</p>
                </a>
            </div>

            <div class="gate-selector" id="xor">
                <a><img src="static/images/gates/xor.svg" alt="XOR gate" width="50" height="50">
                    <p>XOR</p>
                </a>
            </div>
        </div>
    </div>

    <div>
        <div id="topToolbar">
            <button id="startPauseButton">Pause</button>
            <button id="stepButton">Step</button>
            <input type="range" name="" id="speedSelect" min="1" max="60" step="1" value="2"> <p id="speedValue">2</p>

            <select name="" id="circuitSelect"></select>
            <button id="loadCircuitButton">Load</button>
            <input type="text" id="circuitName" value="Untitled">
            <button id="saveCircuitButton">Save</button>
            <button id="newCircuitButton">New</button>
            <button id="deleteCircuitButton">Delete</button>

            <button id="exportButton">Export to JSON</button>
            <input type="file" id="importButton">Import from JSON</button>
        </div>

        <canvas id="mainCanva" width="1000" height="1000"></canvas>
    </div>

    <script src="static/js/circuit.js"></script>
    <script src="static/js/gates.js"></script>
    <script src="static/js/other.js"></script>
    <script src="static/js/gui.js"></script>
    <script src="static/js/index.js"></script>

</body>
</html>
